# Va en el repo Misstery13/Misstery13 como .github/workflows/metrics.yml
#
# Antes de que funcione:
#  1. Crea un token clásico en https://github.com/settings/tokens
#     Marca SOLO el scope "repo" (eso permite contar también tus repos privados
#     en el gráfico de lenguajes, que es justo lo que te interesa).
#  2. Guárdalo en el repo del perfil: Settings > Secrets and variables > Actions
#     > New repository secret, con el nombre METRICS_TOKEN.
#  3. Settings > Actions > General > Workflow permissions > "Read and write".

name: Metrics

on:
  schedule:
    - cron: "0 11 * * 1"      # lunes 06:00 Ecuador
  workflow_dispatch:           # para correrlo a mano desde la pestaña Actions
  push:
    branches: [main]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Misstery13
          filename: github-metrics.svg
          template: classic
          base: header
          config_timezone: America/Guayaquil

          # --- Lenguajes: tu punto más fuerte ---
          # Cuenta también los repos privados (DIVA-AI-VT, brackets-bot,
          # tadc-ecuador-landing, myFirstApp), que es donde está parte de tu
          # mejor trabajo en Python y TypeScript.
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          plugin_languages_colors: github
          # Ignora lo que infla el gráfico sin decir nada de ti:
          plugin_languages_ignored: html, css, scss, tex, batchfile, powershell, shell, dockerfile, makefile

          # --- Calendario isométrico: constancia visible de un vistazo ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
